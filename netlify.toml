[build]
command = "pnpm build"
publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# The blog's old URLs, here rather than in astro.config so they stay real 301s.
[[redirects]]
from = "/blog/the-invariant-pattern---cleaner-typescript-with-assertion-functions"
to = "/blog/the-invariant-pattern-cleaner-typescript-with-assertion-functions"
status = 301

[[redirects]]
from = "/blog/my-default-apps-at-the-end-of-2024"
to = "/blog/my-default-apps-2024"
status = 301

[[redirects]]
from = "/blog/tags/code"
to = "/blog/tags/dev"
status = 301

[[redirects]]
from = "/blog/tag/code"
to = "/blog/tags/dev"
status = 301

[[redirects]]
from = "/blog/reasonsto-2015"
to = "/blog/reasons-to-2015"
status = 301

# Every post is listed on the blog home, so the paged lists and archives are gone.
[[redirects]]
from = "/blog/posts"
to = "/blog"
status = 301

[[redirects]]
from = "/blog/posts/*"
to = "/blog"
status = 301

[[redirects]]
from = "/blog/archives"
to = "/blog"
status = 301

[[redirects]]
from = "/blog/tags/:tag/:page"
to = "/blog/tags/:tag"
status = 301

[[redirects]]
from = "/blog/about"
to = "/"
status = 301

# Missing /blog pages get the blog's own 404 instead of Game Over.
[[redirects]]
from = "/blog/*"
to = "/blog/404/index.html"
status = 404

# Feed readers guess these before finding the link tag.
[[redirects]]
from = "/feed"
to = "/blog/rss.xml"
status = 301

[[redirects]]
from = "/feeds"
to = "/blog/rss.xml"
status = 301

# The light variants are gone; keep links already sent out working.
[[redirects]]
from = "/cv/alt.pdf"
to = "/cv/luca-lischetti-resume.pdf"

# The full resume is no longer published; forced so a stray local copy can't shadow it.
[[redirects]]
from = "/cv/luca-lischetti-resume-full.pdf"
to = "/cv/luca-lischetti-resume.pdf"
force = true

# Slash-page readers look for /colophon; the page is named after the game's ending.
[[redirects]]
from = "/colophon"
to = "/credits"

# The /friends page doubles as the blogroll.
[[redirects]]
from = "/blogroll"
to = "/friends"

# Bridgy Fed answers for the domain, so the fediverse handle is @sirlisko.com@sirlisko.com.
[[redirects]]
from = "/.well-known/host-meta*"
to = "https://fed.brid.gy/.well-known/host-meta:splat"
status = 302

[[redirects]]
from = "/.well-known/webfinger*"
to = "https://fed.brid.gy/.well-known/webfinger"
status = 302

# Proves the Bluesky handle sirlisko.com belongs to the Bridgy Fed account.
[[headers]]
  for = "/.well-known/atproto-did"
  [headers.values]
    Content-Type = "text/plain"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Everything under /_astro is content-hashed, so a new build means a new name.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

