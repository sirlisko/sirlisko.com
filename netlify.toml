[build]
command = "astro build"
publish = "dist"

[build.environment]
  NODE_VERSION = "24"

[[redirects]]
from = "/blog/*"
to = "https://sirlisko-blog.netlify.app/:splat"
status = 200

# The light variants are gone; keep links already sent out working.
[[redirects]]
from = "/cv/alt.pdf"
to = "/cv/luca-lischetti-resume.pdf"

# The full resume is no longer published; forced so a stray local copy can't shadow it.
[[redirects]]
from = "/cv/luca-lischetti-resume-full.pdf"
to = "/cv/luca-lischetti-resume.pdf"
force = true

# Slash-page readers look for /colophon; the page is named after the game's ending.
[[redirects]]
from = "/colophon"
to = "/credits"

# Everything under /_astro is content-hashed, so a new build means a new name.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

