[build]
command = "astro build"
publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# The blog's old URLs. They live here because the proxy below follows the
# blog site's own redirects instead of passing them on.
[[redirects]]
from = "/blog/the-invariant-pattern---cleaner-typescript-with-assertion-functions"
to = "/blog/the-invariant-pattern-cleaner-typescript-with-assertion-functions"
status = 301

[[redirects]]
from = "/blog/my-default-apps-at-the-end-of-2024"
to = "/blog/my-default-apps-2024"
status = 301

[[redirects]]
from = "/blog/tags/code"
to = "/blog/tags/dev"
status = 301

[[redirects]]
from = "/blog/posts"
to = "/blog"
status = 301

[[redirects]]
from = "/blog/about"
to = "/"
status = 301

[[redirects]]
from = "/blog/*"
to = "https://sirlisko-blog.netlify.app/:splat"
status = 200

# The light variants are gone; keep links already sent out working.
[[redirects]]
from = "/cv/alt.pdf"
to = "/cv/luca-lischetti-resume.pdf"

# The full resume is no longer published; forced so a stray local copy can't shadow it.
[[redirects]]
from = "/cv/luca-lischetti-resume-full.pdf"
to = "/cv/luca-lischetti-resume.pdf"
force = true

# Slash-page readers look for /colophon; the page is named after the game's ending.
[[redirects]]
from = "/colophon"
to = "/credits"

# Everything under /_astro is content-hashed, so a new build means a new name.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

