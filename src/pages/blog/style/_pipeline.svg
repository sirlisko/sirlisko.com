<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 344">
	<title>How a post gets published</title>
	<!-- The blog's Game Boy palette (src/styles/blog/palette.css): an <img> can't read the page's variables -->
	<style>
	:root {
		--bg: #dde4c3;
		--fg: #0f380f;
		--soft: #2b4a28;
		--accent: #306230;
		--muted: #c8d3a2;
		--pea: #8bac0f;
	}
	@media (prefers-color-scheme: dark) {
		:root {
			--bg: #142a12;
			--fg: #d3dfb0;
			--soft: #b5c495;
			--accent: #9bbc0f;
			--muted: #253f22;
			--pea: #306230;
		}
	}
	text {
		font-family: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
	}
	.box {
		stroke: var(--fg);
		stroke-width: 2;
		fill: var(--muted);
	}
	.frame {
		stroke: var(--fg);
		stroke-width: 2;
		fill: var(--bg);
	}
	.step {
		stroke: var(--fg);
		stroke-width: 2;
		fill: var(--muted);
	}
	.shadow {
		fill: var(--pea);
	}
	.line {
		stroke: var(--fg);
		stroke-width: 2;
		fill: none;
	}
	.t-title {
		font-size: 15px;
		font-weight: 600;
		fill: var(--fg);
	}
	.t-step {
		font-size: 12px;
		font-weight: 600;
		fill: var(--fg);
	}
	.t-sub {
		font-size: 11px;
		fill: var(--soft);
	}
	.t-label {
		font-size: 11px;
		font-weight: 600;
		fill: var(--accent);
		letter-spacing: 0.5px;
	}
	</style>
	<defs>
		<marker
			id="a"
			markerWidth="8"
			markerHeight="8"
			refX="6"
			refY="4"
			orient="auto-start-reverse"
			markerUnits="userSpaceOnUse"
		>
			<path
				d="M0,0 L8,4 L0,8 Z"
				fill="var(--fg)"
				shape-rendering="crispEdges"
			/>
		</marker>
	</defs>

	<!-- Writing: Obsidian and the repo stay in sync both ways -->
	<rect class="box" x="20" y="20" width="200" height="56" />
	<text class="t-title" x="120" y="44" text-anchor="middle">
		Obsidian vault
	</text>
	<text class="t-sub" x="120" y="62" text-anchor="middle">
		on the Mac and iPhone
	</text>

	<path
		class="line"
		d="M 224 48 L 336 48"
		marker-start="url(#a)"
		marker-end="url(#a)"
	/>
	<text class="t-label" x="280" y="40" text-anchor="middle">UNISON</text>
	<text class="t-label" x="280" y="66" text-anchor="middle">EVERY MINUTE</text>

	<rect class="box" x="340" y="20" width="200" height="56" />
	<text class="t-title" x="440" y="44" text-anchor="middle">
		src/content/posts
	</text>
	<text class="t-sub" x="440" y="62" text-anchor="middle">
		Markdown and images
	</text>

	<path class="line" d="M 440 76 L 440 124" marker-end="url(#a)" />
	<text class="t-label" x="448" y="104">GIT PUSH</text>

	<!-- Building -->
	<rect class="frame" x="20" y="128" width="520" height="112" />
	<text class="t-title" x="36" y="152">astro build, on Netlify</text>

	<rect class="step" x="36" y="166" width="156" height="58" />
	<text class="t-step" x="114" y="190" text-anchor="middle">Pages</text>
	<text class="t-sub" x="114" y="208" text-anchor="middle">
		Shiki, callouts, TOC
	</text>

	<rect class="step" x="202" y="166" width="156" height="58" />
	<text class="t-step" x="280" y="190" text-anchor="middle">Share cards</text>
	<text class="t-sub" x="280" y="208" text-anchor="middle">
		satori and sharp
	</text>

	<rect class="step" x="368" y="166" width="156" height="58" />
	<text class="t-step" x="446" y="190" text-anchor="middle">Search index</text>
	<text class="t-sub" x="446" y="208" text-anchor="middle">Pagefind</text>

	<path class="line" d="M 280 240 L 280 276" marker-end="url(#a)" />

	<!-- Reading -->
	<rect class="shadow" x="138" y="284" width="292" height="52" />
	<rect class="box" x="134" y="280" width="292" height="52" />
	<text class="t-title" x="280" y="302" text-anchor="middle">
		sirlisko.com/blog
	</text>
	<text class="t-sub" x="280" y="320" text-anchor="middle">
		built with the rest of the site
	</text>
</svg>
